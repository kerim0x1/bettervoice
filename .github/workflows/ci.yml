name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

  build:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 40
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[build]"

      - name: Install Inno Setup if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the app, zip and installer
        run: python scripts/build.py --installer

      - name: Check the build
        uses: ./.github/actions/check-windows-build

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: BetterVoice-win-x64
          path: |
            dist/BetterVoice-*-win-x64.zip
            dist/BetterVoice-*-win-x64-setup.exe
          if-no-files-found: error
          compression-level: 0  # zip and installer are compressed already
          retention-days: 14
