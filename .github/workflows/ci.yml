name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # PortAudio for the microphone; a virtual display and xdotool for
          # the window, hotkey and paste tests
          sudo apt-get install -y -qq --no-install-recommends libportaudio2 xvfb xdotool

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        if: runner.os != 'Linux'
        run: python -m pytest

      - name: Test on a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04  # the oldest glibc still supported: runs on more distros
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libportaudio2 xvfb

      - name: Install
        run: python -m pip install -e ".[build]"

      - name: Install Inno Setup if the runner lacks it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the app and its downloads
        run: python scripts/build.py ${{ runner.os == 'Windows' && '--installer' || '' }}

      - name: Check the build
        if: runner.os == 'Windows'
        uses: ./.github/actions/check-windows-build

      - name: Check the build
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/BetterVoice.app
          dist/BetterVoice.app/Contents/MacOS/BetterVoice --check
          hdiutil verify dist/BetterVoice-*-macos-*.dmg

      - name: Check the build
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/BetterVoice/bettervoice --check
          tar -tzf dist/BetterVoice-*-linux-*.tar.gz BetterVoice/bettervoice BetterVoice/install.sh

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: BetterVoice-${{ matrix.name }}
          path: |
            dist/BetterVoice-*.zip
            dist/BetterVoice-*-setup.exe
            dist/BetterVoice-*.dmg
            dist/BetterVoice-*.tar.gz
          if-no-files-found: error
          compression-level: 0  # the downloads are compressed already
          retention-days: 14
