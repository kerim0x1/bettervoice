# Publishes a release on GitHub when a version tag is pushed:
#
#     git tag v0.1.0b1
#     git push origin v0.1.0b1
#
# The tag must match __version__ in src/bettervoice/__init__.py, and
# CHANGELOG.md needs a `## <version>` section: it becomes the release notes.
# The workflow tests and builds on each system - Windows (installer and zip,
# standard and CUDA edition), macOS (disk images for Apple silicon and Intel)
# and Linux (an archive) - checks every build, and publishes all downloads
# with SHA256SUMS.txt. Beta and release-candidate versions become pre-releases.
#
# Run by hand (Actions > Release > Run workflow), it builds the same files as
# workflow artifacts and publishes nothing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true  # a release goes out complete or not at all
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS Apple silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: Linux
            os: ubuntu-22.04  # the oldest glibc still supported: runs on more distros
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libportaudio2 xvfb xdotool

      - name: Install
        run: >-
          python -m pip install -e
          ".[dev,build${{ runner.os == 'Windows' && ',gpu' || '' }}]"

      - name: Check the version
        shell: bash
        run: |
          version=$(python -c "import bettervoice; print(bettervoice.__version__)")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Test
        if: runner.os != 'Linux'
        run: python -m pytest

      - name: Test on a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest

      - name: Install Inno Setup if the runner lacks it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build every download of this system
        run: python scripts/build.py --release

      - name: Check the build
        if: runner.os == 'Windows'
        uses: ./.github/actions/check-windows-build

      - name: Check the build
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/BetterVoice.app
          dist/BetterVoice.app/Contents/MacOS/BetterVoice --check
          hdiutil verify dist/BetterVoice-*-macos-*.dmg

      - name: Check the build
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/BetterVoice/bettervoice --check
          tar -tzf dist/BetterVoice-*-linux-*.tar.gz BetterVoice/bettervoice BetterVoice/install.sh

      - name: Upload the downloads
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/BetterVoice-*.zip
            dist/BetterVoice-*-setup.exe
            dist/BetterVoice-*.dmg
            dist/BetterVoice-*.tar.gz
          if-no-files-found: error
          compression-level: 0  # the downloads are compressed already
          retention-days: 14

  publish:
    name: Publish on GitHub Releases
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums and release notes
        run: |
          cd dist
          sha256sum BetterVoice-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python -m pip install -q pillow
          python scripts/release_notes.py --out dist/release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          files=(dist/BetterVoice-* dist/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # a re-run: replace the files, keep the text
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            flags=(--title "BetterVoice $version" --notes-file dist/release-notes.md --verify-tag)
            if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" "${flags[@]}"
          fi
