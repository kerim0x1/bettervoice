[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bettervoice"
dynamic = ["version"]
description = "Windows dictation: press Win+O, speak, and your words appear wherever your cursor is."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kerim0x1" }]
requires-python = ">=3.10.1"
keywords = ["dictation", "speech-to-text", "voice", "whisper", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "customtkinter>=5.2",
    "faster-whisper>=1.1",
    "numpy",
    "pillow",
    "pyperclip",
    "pystray",
    "sounddevice",
    "websocket-client",
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12"]  # local recognition on an NVIDIA GPU (~700 MB)
dev = ["pytest", "ruff==0.16.8"]  # pinned: a new ruff may add checks; Dependabot bumps it
build = ["pyinstaller>=6.10,<7"]

[project.gui-scripts]
bettervoice = "bettervoice.app:run"

[project.urls]
Homepage = "https://github.com/kerim0x1/bettervoice"
Issues = "https://github.com/kerim0x1/bettervoice/issues"
Changelog = "https://github.com/kerim0x1/bettervoice/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "bettervoice.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bettervoice = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E731",  # small lambdas as callbacks read fine
    "B023",  # callbacks bound in loops are created and called in the same pass
    "UP015",  # explicit open() modes document intent
]
